map $http_x_forwarded_proto $origin_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream turtle_server_http {
    server server:8787;
}

upstream turtle_server_ws {
    server server:8790;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://turtle_server_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_proto;
    }

    location /ws/ {
        proxy_pass http://turtle_server_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://user-web;
        proxy_set_header Host $host;
    }
}

server {
    listen 8081;
    server_name _;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://turtle_server_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_proto;
    }

    location / {
        proxy_pass http://admin-web;
        proxy_set_header Host $host;
    }
}
