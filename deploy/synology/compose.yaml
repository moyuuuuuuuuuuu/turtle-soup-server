name: turtle-soup

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    networks: [internal]

  server:
    build:
      context: ./sources/server
    image: turtle-soup/server:local
    restart: unless-stopped
    env_file: production.env
    user: "1026:100"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/server-runtime:/app/runtime
      - ./data/uploads:/app/public/uploads
    expose:
      - "8787"
      - "8790"
    networks: [internal]

  user-web:
    build:
      context: ./sources/ui
    image: turtle-soup/user-web:local
    restart: unless-stopped
    expose: ["80"]
    networks: [internal]

  admin-web:
    build:
      context: ./sources/admin
    image: turtle-soup/admin-web:local
    restart: unless-stopped
    expose: ["80"]
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      user-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    ports:
      - "18080:8080"
      - "18081:8081"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

networks:
  internal:
    driver: bridge
